name: CI

# Jobs run only for the parts a change touches (ADR D-48).
# Release tags and manual runs check everything.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which parts changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.all.outputs.all }}
      migrations: ${{ steps.filter.outputs.migrations }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      webroot: ${{ steps.filter.outputs.webroot }}
      locked: ${{ steps.filter.outputs.locked }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: all
        run: echo "all=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci: &ci
              - '.github/workflows/**'
              - 'scripts/ci/**'
              - 'design/slices/*/pending.txt'
            migrations:
              - *ci
              - 'server/src/main/resources/db/migration/**'
            server:
              - *ci
              - 'server/**'
              - 'docs/integrate/openapi-*.json'
            web:
              - *ci
              - 'web/**'
              - 'docs/integrate/openapi-*.json'
            # Files that every web package depends on: a change here runs all of web.
            webroot:
              - *ci
              - 'web/*'
              - 'docs/integrate/openapi-*.json'
            locked:
              - *ci
              - 'server/**'
              - 'web/**'
              - 'docs/integrate/openapi-*.json'
            image:
              - *ci
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - 'server/**'
              - 'web/**'

  # Secrets can land in any file, so this always runs. On a push it scans only
  # the pushed commits; on a pull request, only the pull request's commits.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: Migrations have tenant_id (D-18)
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/ci/check-tenant-id.py

  # Server: build and all tests. The server modules are packages in one Maven project
  # (Spring Modulith), and they call each other's public API, so a server change runs
  # the whole server (D-48: changed modules plus their dependents).
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Tests still waiting for implementation are left out (design/slices/*/pending.txt).
      # One JVM runs every class here, so it gets more heap than on the dev PC (pom.xml test.heap).
      - run: ./mvnw -B verify -Dtest.heap=1024m $(python3 ../scripts/ci/pending.py server)
      - name: OpenAPI files match the code (D-21, D-43)
        run: |
          ./mvnw -B -Popenapi test
          git diff --exit-code -- ../docs/integrate/openapi-portal.json ../docs/integrate/openapi-console.json

  # Web: typecheck, lint, test, build. Only the changed packages and their dependents (D-48),
  # unless a shared web file changed or this is a tag or manual run.
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated client matches the contract files (D-21, D-43)
        if: hashFiles('docs/integrate/openapi-portal.json', 'docs/integrate/openapi-console.json') != ''
        run: pnpm gen:api && git diff --exit-code -- packages/api/src/generated
      - id: scope
        run: |
          if [ "${{ needs.changes.outputs.all }}" = "true" ] || [ "${{ needs.changes.outputs.webroot }}" = "true" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "filter=--filter ...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=--filter ...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm -r ${{ steps.scope.outputs.filter }} run typecheck
      - run: pnpm -r ${{ steps.scope.outputs.filter }} run lint
      - run: pnpm -r --workspace-concurrency=1 ${{ steps.scope.outputs.filter }} run test $(python3 ../scripts/ci/pending.py web)
      - run: pnpm -r ${{ steps.scope.outputs.filter }} run build
      - name: Duplicated code stays under the limit in web/.jscpd.json
        run: pnpm dup
      - name: The portal bundle holds no console API path (D-43)
        if: hashFiles('web/portal/dist/**') != ''
        run: python3 ../scripts/ci/check-portal-bundle.py portal/dist

  # The app image and the tests that run it (@Tag("deploy"): compose files, popdesk command,
  # upgrade harness, load test, and the empty-install E2E in io.popdesk.e2e). The server job
  # leaves this tag out. They share the compose volume names, so they run one class at a time.
  # Picked by tag, not with -Dtest: Surefire drops the excludes file when -Dtest is given, and
  # deploy tests still waiting for implementation (pending.txt) must be left out here too.
  image:
    name: Image and deploy tests
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        run: docker buildx build --load -t popdesk:test .
      - name: Deploy tests
        working-directory: server
        env:
          POPDESK_PYTHON: python3
        run: ./mvnw -B test -Dtest.groups=deploy -Dtest.excludedGroups=openapi $(python3 ../scripts/ci/pending.py server)

  # Locked tests, merged migrations, and the split between the side that writes tests and the
  # side that implements (design/process.md section C, guard table). The scripts run from the base
  # commit, so a change cannot loosen the checks that judge it.
  locked:
    name: Locked tests and test style
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.locked == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/heads/') }}" = "true" ] \
               && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Take the gate scripts from the base commit
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ] && git cat-file -e "${{ steps.base.outputs.ref }}:scripts/ci/lockrules.py" 2>/dev/null; then
            git worktree add -q "$RUNNER_TEMP/gate" "${{ steps.base.outputs.ref }}"
            echo "GATE=$RUNNER_TEMP/gate/scripts/ci" >> "$GITHUB_ENV"
          else
            echo "GATE=$PWD/scripts/ci" >> "$GITHUB_ENV"
          fi
      # --role any judges commit by commit (several tabs' commits arrive in one push).
      - run: python3 "$GATE/tests-lock.py" check
      - run: python3 "$GATE/check-test-style.py"
      - if: steps.base.outputs.ref != ''
        run: python3 "$GATE/check-locked-paths.py" --base "${{ steps.base.outputs.ref }}" --role any

  # Gates to add once there is code (design/spec/architecture.md section 8).
  # Each one gets `needs: changes` and an `if:` on `all` plus its area
  # (`server` or `web`), and runs only the affected modules or packages:
  # - E2E (Playwright, compose) when server or web changed
  # - dependency vulnerabilities (osv-scanner) and licenses when a lockfile changed
  # - visual regression when web/packages/ui or a story changed
  # - static checks on production code: the server job and the web lint already run the ones of
  #   ADR D-58 (paths under the three API prefixes, admin-only operations against the contract,
  #   no sleep, exit, stack inspection, or profiles in src/main, no swallowed exceptions,
  #   @Transactional not on controllers or repositories, no-console). Still to add: unused code
  #   (Error Prone), SpotBugs with FindSecBugs, PMD CPD for new duplication on the server,
  #   playwright no-wait-for-timeout
  # On release tags only (all == 'true'): every job above in full, upgrade tests,
  # SBOM (D-29), multi-arch image build (D-45)
