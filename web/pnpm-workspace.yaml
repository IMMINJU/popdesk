packages:
  - portal
  - console
  - packages/*
  - e2e

# One exact version per tool. Packages refer to these with "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@playwright/test': 1.64.0
  '@storybook/addon-vitest': 10.6.1
  '@storybook/react-vite': 10.6.1
  '@stryker-mutator/core': 10.0.0
  '@stryker-mutator/vitest-runner': 10.0.0
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/node': 26.6.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/browser': 5.0.3
  '@vitest/browser-playwright': 5.0.3
  axe-core: 4.14.0
  eslint: 10.12.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  jscpd: 4.0.5
  jsdom: 29.1.1
  msw: 3.0.2
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  playwright: 1.64.0
  react: 19.3.0
  react-dom: 19.3.0
  react-router: 8.4.0
  storybook: 10.6.1
  typescript: 5.9.3
  typescript-eslint: 8.71.1
  vite: 8.3.3
  vitest: 5.0.3

# esbuild (via Storybook) works from its platform package; its install script
# only checks that binary, so it is not run.
allowBuilds:
  esbuild: false

# The Stryker vitest runner names tests with spaces; Vitest 5 matches names joined
# with ' > ', so every mutant run skipped all tests. Remove when upstream fixes it.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
