spring:
  application:
    name: popdesk
  datasource:
    # logServerErrorDetail=false keeps values from database errors (for example an email
    # address in a unique key violation) out of exception messages and the log.
    url: ${POPDESK_DB_URL:jdbc:postgresql://localhost:5432/popdesk?logServerErrorDetail=false}
    username: ${POPDESK_DB_USER:popdesk}
    password: ${POPDESK_DB_PASSWORD}
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    postgresql:
      # Flyway's per-migration lock would wait forever on CREATE INDEX CONCURRENTLY (S0-AC-08).
      # The single-instance lock (io.popdesk.InstanceLock) keeps a second app out instead.
      transactional-lock: false

server:
  port: 8080

management:
  server:
    # Health checks and metrics; not served on 8080 (docs/operate/configuration.md).
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Down while there is no first admin (S0-AC-02); liveness stays up.
          include: readinessState,firstAdmin

springdoc:
  # The contract files are generated by a test (server/README.md), not served by the app.
  api-docs:
    enabled: false
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  # The two groups, one contract per app (ADR D-43), are defined in io.popdesk.OpenApiConfig.
