spring:
  application:
    name: popdesk
  main:
    # Every line on standard output is one JSON object (S0-AC-86); the banner is not.
    banner-mode: off
  autoconfigure:
    # popdesk signs people in itself; Spring Boot's generated user would log a password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # logServerErrorDetail=false keeps values from database errors (for example an email
    # address in a unique key violation) out of exception messages and the log.
    url: ${POPDESK_DB_URL:jdbc:postgresql://localhost:5432/popdesk?logServerErrorDetail=false}
    username: ${POPDESK_DB_USER:popdesk}
    password: ${POPDESK_DB_PASSWORD}
    hikari:
      # A transaction waits at most 5 seconds for a row lock, then is retried once (S0-AC-85).
      connection-init-sql: SET lock_timeout = '5s'
  session:
    # The tables come from the migrations (V1), never from Spring Session's script.
    jdbc:
      initialize-schema: never
    # The session ends 8 hours after sign-in by the app's clock (io.popdesk.helpdesk.account.Sessions);
    # this only lets the database forget it afterwards.
    timeout: 8h
  jpa:
    open-in-view: false
  servlet:
    multipart:
      # A file over 10 MB still reaches the app and gets 400 FILE_TOO_LARGE (S0-AC-57); larger requests
      # are 413. A filing carries up to 50 MB of files (S0-AC-99, architecture.md "Attachment storage").
      max-file-size: 11MB
      max-request-size: 55MB
      # Every received file goes to a temporary file at once, never into memory.
      file-size-threshold: 0
  flyway:
    locations: classpath:db/migration
    postgresql:
      # Flyway's per-migration lock would wait forever on CREATE INDEX CONCURRENTLY (S0-AC-08).
      # The single-instance lock (io.popdesk.InstanceLock) keeps a second app out instead.
      transactional-lock: false

server:
  port: 8080
  servlet:
    session:
      timeout: 8h

logging:
  structured:
    format:
      # One JSON object per line, emails masked (PII-2, S0-AC-86).
      console: io.popdesk.JsonLogFormat
  level:
    # Its WARN line quotes the database's message, which can hold a value (S0 premortem 4).
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR

management:
  server:
    # Health checks and metrics; not served on 8080 (docs/operate/configuration.md).
    port: 8081
  endpoints:
    web:
      exposure:
        # Metrics for Prometheus (S0-AC-78); still only on the management port.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Down while there is no first admin (S0-AC-02); liveness stays up.
          include: readinessState,firstAdmin

springdoc:
  # The contract files are generated by a test (server/README.md), not served by the app.
  api-docs:
    enabled: false
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  # The two groups, one contract per app (ADR D-43), are defined in io.popdesk.OpenApiConfig.
